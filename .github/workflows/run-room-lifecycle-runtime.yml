name: Run playable room lifecycle integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/playable-room-lifecycle' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playable-room-lifecycle
      - name: Extract and run integration script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-room-lifecycle-runtime.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n      - name: Run host tests"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_room_lifecycle.py').write_text(script)
          PY
          python3 /tmp/apply_room_lifecycle.py
      - name: Run host tests and capture diagnostics
        id: host_tests
        shell: bash
        run: |
          set +e
          bash scripts/run_host_tests.sh > room-lifecycle-host-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat room-lifecycle-host-test.log
          exit 0
      - name: Commit runtime or diagnostics
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.host_tests.outputs.status }}" = "0" ]; then
            rm -f room-lifecycle-host-test.log
            git add include/gameplay/PlayableShelterSession.hpp source/PlayableShelterSession.cpp tests/playable_shelter_session_tests.cpp
            git commit -m "Integrate playable room lifecycle runtime"
          else
            git add room-lifecycle-host-test.log
            git commit -m "Capture room lifecycle host test failure"
          fi
          git push origin HEAD:agent/playable-room-lifecycle
      - name: Fail when host tests failed
        if: steps.host_tests.outputs.status != '0'
        run: exit 1
