name: Apply issue 95 patch from PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-first-save-rotation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-first-save-rotation
      - name: Extract and run patch
        shell: bash
        run: |
          awk '/^[[:space:]]*python3 - <<'"'"'PY'"'"'/{capture=1; next} capture && /^[[:space:]]*PY$/{exit} capture{sub(/^          /, ""); print}' .github/workflows/export-source.yml > /tmp/issue95_patch.py
          python3 /tmp/issue95_patch.py
          bash scripts/run_host_tests.sh
      - name: Commit tested product changes
        shell: bash
        run: |
          rm .github/workflows/export-source.yml .github/workflows/apply-issue95-pr.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix first save rotation on 3DS"
          git push origin HEAD:agent/fix-first-save-rotation
