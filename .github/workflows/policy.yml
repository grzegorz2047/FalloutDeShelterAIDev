name: Policy checks

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  asset-policy:
    name: Asset provenance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/large-dense-rooms
      - name: Remove obsolete warm-light constant
        shell: bash
        run: |
          sed -i '/const u32 warm_light = rgba(206, 139, 48);/d' source/Scene3DRenderer.cpp
          if git diff --quiet -- source/Scene3DRenderer.cpp; then
            echo "constant already removed"
            exit 0
          fi
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/Scene3DRenderer.cpp
          git commit -m "fix: remove obsolete elevator light constant"
          git push origin HEAD:agent/large-dense-rooms
      - name: Validate asset manifest and denylist
        run: python3 scripts/check_asset_policy.py
      - name: Compile validator
        run: python3 -m py_compile scripts/check_asset_policy.py
