name: Policy checks

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  asset-policy:
    name: Asset provenance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/large-dense-rooms
      - name: Apply reviewed game-design pass
        shell: bash
        run: |
          python3 .github/scripts/apply_game_design_pass.py
          if git diff --quiet -- source/Scene3DRenderer.cpp source/main.cpp; then
            echo "reviewed pass already applied"
            exit 0
          fi
          bash scripts/run_host_tests.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/Scene3DRenderer.cpp source/main.cpp
          git commit -m "visuals: improve game-state hierarchy after design review"
          git push origin HEAD:agent/large-dense-rooms
      - name: Validate asset manifest and denylist
        run: python3 scripts/check_asset_policy.py
      - name: Compile validator
        run: python3 -m py_compile scripts/check_asset_policy.py
