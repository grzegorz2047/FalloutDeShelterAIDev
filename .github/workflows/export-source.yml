name: Export source checkout

on:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact checkout
        shell: bash
        run: git archive --format=zip --output=FalloutDeShelterAIDev-source.zip HEAD
      - name: Upload source checkout
        uses: actions/upload-artifact@v4
        with:
          name: FalloutDeShelterAIDev-source
          path: FalloutDeShelterAIDev-source.zip
          if-no-files-found: error
          retention-days: 1
