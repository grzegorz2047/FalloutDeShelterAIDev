name: Diagnose ARM exception

on:
  pull_request:

permissions:
  contents: read

jobs:
  symbolize:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Build symbols
        shell: bash
        run: |
          set -euo pipefail
          make release -j2
          {
            echo "LR 0x08003908"
            arm-none-eabi-addr2line -a -f -C -e DeepShelter3D.elf 0x08003908
            echo "R03 0x080009F8"
            arm-none-eabi-addr2line -a -f -C -e DeepShelter3D.elf 0x080009F8
            echo "R01/R07/R14 0x08003908"
            arm-none-eabi-objdump -d -C DeepShelter3D.elf | grep -B12 -A12 '8003908:' || true
          } | tee arm-exception-symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeepShelter3D-arm-exception-symbols
          path: |
            arm-exception-symbols.txt
            DeepShelter3D.map
          if-no-files-found: error
