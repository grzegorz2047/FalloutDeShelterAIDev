name: Run final room lifecycle V3 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/playable-room-lifecycle' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playable-room-lifecycle
      - name: Apply source-only V3 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          workflow = Path('scripts/apply_room_lifecycle_v3_source.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n      - name: Run host tests"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          match = re.search(r"source\s*=\s*Path\('source/PlayableShelterSession\.cpp'\)", script)
          if match is None:
              raise SystemExit('source patch start missing')
          prefix = '''from pathlib import Path

def replace_once(text, old, new, label):
    if old not in text:
        if label == 'V2 migration flag':
            actual = "    result.migrated_from_v1 =\n        version == kPlayableSaveVersionV1;\n    return result;\n"
            if actual not in text:
                raise SystemExit('V2 migration flag exact fallback missing')
            return text.replace(actual, new, 1)
        raise SystemExit(f'{label} anchor missing')
    return text.replace(old, new, 1)

'''
          Path('/tmp/apply_room_lifecycle_v3.py').write_text(prefix + script[match.start():])
          PY
          python3 /tmp/apply_room_lifecycle_v3.py
      - name: Run host tests
        run: bash scripts/run_host_tests.sh
      - name: Commit tested V3 persistence
        shell: bash
        run: |
          rm -f room-lifecycle-v3-patch.log corrected-v3-patch.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/gameplay/PlayableShelterSession.hpp source/PlayableShelterSession.cpp tests/playable_shelter_session_tests.cpp room-lifecycle-v3-patch.log corrected-v3-patch.log
          git commit -m "Persist playable room lifecycle in save V3"
          git push origin HEAD:agent/playable-room-lifecycle
