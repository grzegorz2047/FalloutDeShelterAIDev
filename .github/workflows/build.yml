name: Build

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'publish-v*'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          test -f "$DEVKITARM/3ds_rules"
          test -f "$DEVKITPRO/libctru/include/3ds.h"
          test -f "$DEVKITPRO/libctru/lib/libctru.a"
          test -f "$DEVKITPRO/libctru/lib/libcitro3d.a"
          test -f "$DEVKITPRO/libctru/lib/libcitro2d.a"
          command -v python3
          command -v g++
      - name: Host architecture tests
        shell: bash
        run: bash scripts/run_host_tests.sh
      - name: Policy and syntax checks
        run: make test
      - name: Build 3DSX and CIA
        shell: bash
        run: |
          set -o pipefail
          make release -j2 2>&1 | tee build.log
          cd dist
          sha256sum -c SHA256SUMS.txt
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepShelter3D-build-log
          path: build.log
          if-no-files-found: warn
      - name: Upload playable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepShelter3D-playable
          path: |
            dist/DeepShelter3D.3dsx
            dist/DeepShelter3D.cia
            dist/SHA256SUMS.txt
          if-no-files-found: error

  azahar-smoke:
    name: Azahar smoke test
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeepShelter3D-playable
          path: dist
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq xvfb x11-utils imagemagick libfuse2 libgl1 libopengl0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libdbus-1-3
      - name: Download Azahar
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://api.github.com/repos/azahar-emu/azahar/releases?per_page=10" > releases.json
          url=$(jq -r '[.[] | select(.draft == false) | .assets[] | select(.name | test("\\.AppImage$")) | select((.name | ascii_downcase | contains("wayland")) | not) | .browser_download_url][0]' releases.json)
          test "$url" != "null"
          curl -fL --retry 3 "$url" -o azahar.AppImage
          chmod +x azahar.AppImage
          ./azahar.AppImage --appimage-extract > azahar-extract.log 2>&1
          test -x squashfs-root/AppRun
      - name: Install CIA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p azahar-home
          HOME="$PWD/azahar-home" timeout 90s xvfb-run -a ./squashfs-root/AppRun --install "$PWD/dist/DeepShelter3D.cia" 2>&1 | tee azahar-cia-install.log
          grep -q "Installed CIA successfully" azahar-cia-install.log
      - name: Launch 3DSX and verify first frame
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          display_number=99
          while [ -e "/tmp/.X${display_number}-lock" ] || [ -S "/tmp/.X11-unix/X${display_number}" ]; do
            display_number=$((display_number + 1))
          done
          export DISPLAY=":${display_number}"
          echo "Using Xvfb display $DISPLAY"

          Xvfb "$DISPLAY" -screen 0 1280x720x24 -nolisten tcp > azahar-xvfb.log 2>&1 &
          xvfb_pid=$!
          cleanup() {
            if [ -n "${azahar_pid:-}" ]; then
              kill -- -"$azahar_pid" 2>/dev/null || true
            fi
            kill "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$xvfb_pid" 2>/dev/null; then
              cat azahar-xvfb.log >&2
              exit 1
            fi
            sleep 0.25
          done
          xdpyinfo -display "$DISPLAY" >/dev/null

          HOME="$PWD/azahar-home" setsid ./squashfs-root/AppRun -w "$PWD/dist/DeepShelter3D.3dsx" > azahar-3dsx-launch.log 2>&1 &
          azahar_pid=$!

          for second in $(seq 1 18); do
            sleep 1
            if ! kill -0 "$azahar_pid" 2>/dev/null; then
              wait "$azahar_pid" || true
              echo "Azahar exited before producing a stable frame." >&2
              cat azahar-3dsx-launch.log >&2
              exit 1
            fi
          done

          timeout 10s xwininfo -display "$DISPLAY" -root -tree > azahar-window-tree.log
          if grep -Eq "An exception occurred|ExceptionRaised|NoExecuteFault" azahar-window-tree.log azahar-3dsx-launch.log; then
            echo "Azahar reported an emulated application exception." >&2
            cat azahar-window-tree.log >&2
            cat azahar-3dsx-launch.log >&2
            exit 1
          fi

          timeout 10s import -display "$DISPLAY" -window root azahar-first-frame.png
          test -s azahar-first-frame.png
          colors=$(timeout 10s identify -format '%k' azahar-first-frame.png)
          echo "Captured first frame with $colors colors"
          test "$colors" -gt 16

          if grep -Eq "could not connect to display|X11 connection broke|terminate called|Fatal|Unhandled exception" azahar-3dsx-launch.log; then
            cat azahar-3dsx-launch.log >&2
            exit 1
          fi

          kill -- -"$azahar_pid" 2>/dev/null || true
          for attempt in $(seq 1 20); do
            if ! kill -0 "$azahar_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
      - name: Upload Azahar logs and first frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepShelter3D-Azahar-logs
          path: |
            azahar-*.log
            azahar-first-frame.png
          if-no-files-found: warn

  publish-release:
    name: Publish immutable alpha release
    if: github.event_name == 'push' && startsWith(github.ref_name, 'publish-v')
    needs:
      - build-release
      - azahar-smoke
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DeepShelter3D-playable
          path: dist
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#publish-}"
          test "$version" != "$GITHUB_REF_NAME"
          test -s "releases/$version.txt"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists; releases are immutable." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/DeepShelter3D.cia
          test -s dist/DeepShelter3D.3dsx
          test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          test -s docs/INSTALLATION.md
      - name: Publish GitHub pre-release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$version" \
            --notes-file "releases/$version.txt" \
            --prerelease \
            dist/DeepShelter3D.cia \
            dist/DeepShelter3D.3dsx \
            dist/SHA256SUMS.txt \
            docs/INSTALLATION.md
