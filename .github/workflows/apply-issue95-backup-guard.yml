name: Apply issue 95 backup guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-first-save-rotation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-first-save-rotation
      - name: Preserve an existing backup when main save is missing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          session = Path('source/PlayableShelterSession.cpp')
          text = session.read_text()
          old = '''    } else {
              std::remove(backup.c_str());
          }
          if (std::rename(temp.c_str(), main.c_str()) != 0) {'''
          new = '''    }
          if (std::rename(temp.c_str(), main.c_str()) != 0) {'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected backup-removal matches: {text.count(old)}')
          session.write_text(text.replace(old, new, 1))

          tests = Path('tests/playable_shelter_session_tests.cpp')
          text = tests.read_text()
          marker = '''    std::ofstream broken(path + ".sav",
                               std::ios::binary | std::ios::trunc);'''
          insertion = '''    assert(std::remove((path + ".sav").c_str()) == 0);
              assert(save_playable_state(path, newer.state()) ==
                     PlayableSaveStatus::Ok);
              assert(access((path + ".sav").c_str(), F_OK) == 0);
              assert(access((path + ".bak").c_str(), F_OK) == 0);
              std::ifstream preserved_backup_file(path + ".bak", std::ios::binary);
              const std::vector<std::uint8_t> preserved_backup_bytes(
                  (std::istreambuf_iterator<char>(preserved_backup_file)),
                  std::istreambuf_iterator<char>());
              const auto preserved_backup = decode_playable_state(
                  preserved_backup_bytes);
              assert(preserved_backup.status == PlayableSaveStatus::Ok);
              assert(preserved_backup.state.room_entries[1].production_steps == 73);

          ''' + marker
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected broken-save marker matches: {text.count(marker)}')
          tests.write_text(text.replace(marker, insertion, 1))
          PY
      - name: Run host tests
        run: bash scripts/run_host_tests.sh
      - name: Commit tested guard
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/PlayableShelterSession.cpp tests/playable_shelter_session_tests.cpp
          git commit -m "Preserve backup when main save is missing"
          git push origin HEAD:agent/fix-first-save-rotation
