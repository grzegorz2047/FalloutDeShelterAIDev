name: Apply playable room lifecycle runtime

on:
  push:
    branches:
      - agent/playable-room-lifecycle

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playable-room-lifecycle
      - name: Integrate room lifecycle runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path('include/gameplay/PlayableShelterSession.hpp')
          text = header.read_text()
          text = text.replace('''enum class CollectResult {
              Collected,
              NothingStored,
          };
          ''', '''enum class CollectResult {
              Collected,
              NothingStored,
          };

          enum class RoomLifecycleResult {
              Applied,
              MissingRoom,
              NotEnoughCredits,
              MaximumLevel,
              UnsafeResidents,
              UnsafeStoredResources,
              UnsafeProduction,
              LastRoom,
          };

          struct PlayableRoomLifecyclePreview {
              RoomLifecycleResult result = RoomLifecycleResult::MissingRoom;
              int credit_delta = 0;
              int group_width = 0;
              int residents_affected = 0;
              int stored_units_affected = 0;
              int production_steps_affected = 0;

              [[nodiscard]] bool allowed() const noexcept {
                  return result == RoomLifecycleResult::Applied;
              }
          };
          ''')
          text = text.replace('''struct PlayableRoomEntry {
              bool active = false;
              PlayableRoomType type = PlayableRoomType::Power;
              int column = 0;
              int floor = 0;
              int stored = 0;
              int production_steps = 0;
          };
          ''', '''struct PlayableRoomEntry {
              bool active = false;
              PlayableRoomType type = PlayableRoomType::Power;
              int column = 0;
              int floor = 0;
              int stored = 0;
              int production_steps = 0;
              std::uint64_t segment_id = 0;
              std::uint64_t group_id = 0;
              int level = 1;
          };
          ''')
          text = text.replace('''    std::array<PlayableRoomEntry, kPlayableRoomCapacity> room_entries{};
              std::array<PlayableResidentEntry, kPlayableResidentCount> residents{};
          };
          ''', '''    std::array<PlayableRoomEntry, kPlayableRoomCapacity> room_entries{};
              std::array<PlayableResidentEntry, kPlayableResidentCount> residents{};
              std::uint64_t next_segment_id = 1;
          };
          ''')
          text = text.replace('''    [[nodiscard]] PlayableResidentPosition resident_position(
                  std::size_t resident_index) const noexcept;

              [[nodiscard]] int selected_stored() const noexcept;
          ''', '''    [[nodiscard]] PlayableResidentPosition resident_position(
                  std::size_t resident_index) const noexcept;
              [[nodiscard]] int selected_group_width() const noexcept;
              [[nodiscard]] PlayableRoomLifecyclePreview
              preview_upgrade_selected() const noexcept;
              [[nodiscard]] RoomLifecycleResult
              confirm_upgrade_selected() noexcept;
              [[nodiscard]] PlayableRoomLifecyclePreview
              preview_demolish_selected() const noexcept;
              [[nodiscard]] RoomLifecycleResult
              confirm_demolish_selected() noexcept;

              [[nodiscard]] int selected_stored() const noexcept;
          ''')
          header.write_text(text)

          source = Path('source/PlayableShelterSession.cpp')
          text = source.read_text()
          anchor = '''bool room_produces(PlayableRoomType type) noexcept {
              return type != PlayableRoomType::Living &&
                     type != PlayableRoomType::Elevator;
          }
          '''
          addition = anchor + '''
          constexpr int kPlayableMaximumRoomLevel = 3;
          constexpr int kPlayableMaximumGroupWidth = 3;

          int upgrade_cost(const PlayableRoomEntry& room, int group_width) noexcept {
              return 75 * group_width * room.level;
          }

          int demolition_refund(const PlayableRoomEntry& room) noexcept {
              return room_cost(room.type) * room.level / 2;
          }

          void normalize_room_groups(PlayableShelterState& state) noexcept {
              std::uint64_t highest_id = 0;
              for (auto& room : state.room_entries) {
                  if (!room.active) continue;
                  if (room.segment_id == 0) room.segment_id = state.next_segment_id++;
                  highest_id = std::max(highest_id, room.segment_id);
                  room.group_id = room.segment_id;
                  room.level = std::max(1, std::min(room.level, kPlayableMaximumRoomLevel));
              }
              state.next_segment_id = std::max(state.next_segment_id, highest_id + 1);

              for (int floor = 0; floor < kPlayableGridFloors; ++floor) {
                  int column = 0;
                  while (column < kPlayableGridColumns) {
                      const int first_index = room_index_at_state(state, column, floor);
                      if (first_index < 0) {
                          ++column;
                          continue;
                      }
                      auto& first = state.room_entries[static_cast<std::size_t>(first_index)];
                      std::uint64_t stable_group = first.segment_id;
                      int width = 1;
                      while (width < kPlayableMaximumGroupWidth &&
                             column + width < kPlayableGridColumns) {
                          const int candidate_index = room_index_at_state(
                              state, column + width, floor);
                          if (candidate_index < 0) break;
                          const auto& candidate = state.room_entries[
                              static_cast<std::size_t>(candidate_index)];
                          if (candidate.type != first.type || candidate.level != first.level) break;
                          stable_group = std::min(stable_group, candidate.segment_id);
                          ++width;
                      }
                      for (int offset = 0; offset < width; ++offset) {
                          const int member_index = room_index_at_state(
                              state, column + offset, floor);
                          state.room_entries[static_cast<std::size_t>(member_index)].group_id =
                              stable_group;
                      }
                      column += width;
                  }
              }
          }
          '''
          if anchor not in text:
              raise SystemExit('room_produces anchor missing')
          text = text.replace(anchor, addition, 1)
          text = text.replace('''    sync_legacy_fields(state);
          }

          PlayableShelterState normalized_state(
              PlayableShelterState state) noexcept {
              upgrade_legacy_shape(state);
              return state;
          }
          ''', '''    normalize_room_groups(state);
              sync_legacy_fields(state);
          }

          PlayableShelterState normalized_state(
              PlayableShelterState state) noexcept {
              upgrade_legacy_shape(state);
              normalize_room_groups(state);
              return state;
          }
          ''', 1)
          text = text.replace('''    room.stored = 0;
              room.production_steps = 0;
              state_.credits -= preview.cost;
          ''', '''    room.stored = 0;
              room.production_steps = 0;
              room.segment_id = state_.next_segment_id++;
              room.group_id = room.segment_id;
              room.level = 1;
              state_.credits -= preview.cost;
          ''', 1)
          text = text.replace('''    state_.selected_room = slot;
              sync_legacy_view();
              return BuildResult::Built;
          }

          int PlayableShelterSession::room_index_at(
          ''', '''    state_.selected_room = slot;
              normalize_room_groups(state_);
              sync_legacy_view();
              return BuildResult::Built;
          }

          int PlayableShelterSession::selected_group_width() const noexcept {
              const auto& selected = state_.room_entries[
                  static_cast<std::size_t>(state_.selected_room)];
              int width = 0;
              for (const auto& room : state_.room_entries) {
                  if (room.active && room.group_id == selected.group_id) ++width;
              }
              return width;
          }

          PlayableRoomLifecyclePreview
          PlayableShelterSession::preview_upgrade_selected() const noexcept {
              PlayableRoomLifecyclePreview preview;
              const auto& selected = state_.room_entries[
                  static_cast<std::size_t>(state_.selected_room)];
              if (!selected.active) return preview;
              preview.group_width = selected_group_width();
              if (selected.level >= kPlayableMaximumRoomLevel) {
                  preview.result = RoomLifecycleResult::MaximumLevel;
                  return preview;
              }
              const int cost = upgrade_cost(selected, preview.group_width);
              preview.credit_delta = -cost;
              if (state_.credits < cost) {
                  preview.result = RoomLifecycleResult::NotEnoughCredits;
                  return preview;
              }
              for (int index = 0; index < kPlayableRoomCapacity; ++index) {
                  const auto& room = state_.room_entries[static_cast<std::size_t>(index)];
                  if (!room.active || room.group_id != selected.group_id) continue;
                  preview.stored_units_affected += room.stored;
                  preview.production_steps_affected += room.production_steps;
                  for (const auto& resident : state_.residents) {
                      if (resident.active && resident.assigned_room == index) {
                          ++preview.residents_affected;
                      }
                  }
              }
              preview.result = RoomLifecycleResult::Applied;
              return preview;
          }

          RoomLifecycleResult
          PlayableShelterSession::confirm_upgrade_selected() noexcept {
              const auto preview = preview_upgrade_selected();
              if (!preview.allowed()) return preview.result;
              const std::uint64_t group_id = state_.room_entries[
                  static_cast<std::size_t>(state_.selected_room)].group_id;
              state_.credits += preview.credit_delta;
              for (auto& room : state_.room_entries) {
                  if (room.active && room.group_id == group_id) ++room.level;
              }
              normalize_room_groups(state_);
              sync_legacy_view();
              return RoomLifecycleResult::Applied;
          }

          PlayableRoomLifecyclePreview
          PlayableShelterSession::preview_demolish_selected() const noexcept {
              PlayableRoomLifecyclePreview preview;
              const int selected_index = state_.selected_room;
              const auto& selected = state_.room_entries[
                  static_cast<std::size_t>(selected_index)];
              if (!selected.active) return preview;
              preview.group_width = selected_group_width();
              preview.credit_delta = demolition_refund(selected);
              preview.stored_units_affected = selected.stored;
              preview.production_steps_affected = selected.production_steps;
              for (const auto& resident : state_.residents) {
                  if (resident.active && resident.assigned_room == selected_index) {
                      ++preview.residents_affected;
                  }
              }
              if (state_.rooms <= 1) {
                  preview.result = RoomLifecycleResult::LastRoom;
              } else if (preview.residents_affected > 0) {
                  preview.result = RoomLifecycleResult::UnsafeResidents;
              } else if (preview.stored_units_affected > 0) {
                  preview.result = RoomLifecycleResult::UnsafeStoredResources;
              } else if (preview.production_steps_affected > 0) {
                  preview.result = RoomLifecycleResult::UnsafeProduction;
              } else {
                  preview.result = RoomLifecycleResult::Applied;
              }
              return preview;
          }

          RoomLifecycleResult
          PlayableShelterSession::confirm_demolish_selected() noexcept {
              const auto preview = preview_demolish_selected();
              if (!preview.allowed()) return preview.result;
              const int removed = state_.selected_room;
              state_.credits += preview.credit_delta;
              state_.room_entries[static_cast<std::size_t>(removed)] = {};
              for (auto& resident : state_.residents) {
                  if (resident.assigned_room == removed) {
                      resident.assigned_room = -1;
                      resident.state = PlayableResidentState::Roaming;
                  }
              }
              normalize_room_groups(state_);
              int replacement = -1;
              for (int index = removed - 1; index >= 0; --index) {
                  if (state_.room_entries[static_cast<std::size_t>(index)].active) {
                      replacement = index;
                      break;
                  }
              }
              if (replacement < 0) {
                  for (int index = removed + 1; index < kPlayableRoomCapacity; ++index) {
                      if (state_.room_entries[static_cast<std::size_t>(index)].active) {
                          replacement = index;
                          break;
                      }
                  }
              }
              state_.selected_room = replacement;
              sync_legacy_view();
              return RoomLifecycleResult::Applied;
          }

          int PlayableShelterSession::room_index_at(
          ''', 1)
          text = text.replace('''        if (!valid_room_type(room.type) ||
                  !in_grid(room.column, room.floor) ||
                  room.stored < 0 ||
          ''', '''        if (!valid_room_type(room.type) ||
                  !in_grid(room.column, room.floor) ||
                  room.segment_id == 0 || room.group_id == 0 ||
                  room.level < 1 || room.level > kPlayableMaximumRoomLevel ||
                  room.stored < 0 ||
          ''', 1)
          source.write_text(text)

          tests = Path('tests/playable_shelter_session_tests.cpp')
          text = tests.read_text()
          insertion = r'''
          void playable_room_groups_upgrade_and_demolish_are_atomic() {
              PlayableShelterState rich_state;
              rich_state.credits = 3000;
              PlayableShelterSession session(rich_state);
              assert(session.select_build_type(PlayableRoomType::Food));
              for (int column = 1; column <= 3; ++column) {
                  assert(session.set_build_cursor(column, 0));
                  assert(session.confirm_build() == BuildResult::Built);
              }
              const int first = session.room_index_at(1, 0);
              const int middle = session.room_index_at(2, 0);
              const int last = session.room_index_at(3, 0);
              assert(first >= 0 && middle >= 0 && last >= 0);
              const auto group = session.state().room_entries[
                  static_cast<std::size_t>(first)].group_id;
              assert(group != 0);
              assert(session.state().room_entries[static_cast<std::size_t>(middle)].group_id == group);
              assert(session.state().room_entries[static_cast<std::size_t>(last)].group_id == group);
              assert(session.selected_group_width() == 3);

              const int credits_before_upgrade = session.state().credits;
              const auto upgrade = session.preview_upgrade_selected();
              assert(upgrade.allowed());
              assert(upgrade.group_width == 3);
              assert(upgrade.credit_delta == -225);
              assert(session.confirm_upgrade_selected() == RoomLifecycleResult::Applied);
              assert(session.state().credits == credits_before_upgrade - 225);
              assert(session.state().room_entries[static_cast<std::size_t>(first)].level == 2);
              assert(session.state().room_entries[static_cast<std::size_t>(middle)].level == 2);
              assert(session.state().room_entries[static_cast<std::size_t>(last)].level == 2);

              const int credits_before_demolish = session.state().credits;
              const auto demolition = session.preview_demolish_selected();
              assert(demolition.allowed());
              assert(demolition.credit_delta == 120);
              assert(session.confirm_demolish_selected() == RoomLifecycleResult::Applied);
              assert(session.state().credits == credits_before_demolish + 120);
              assert(session.room_index_at(3, 0) < 0);
              assert(session.state().room_entries[static_cast<std::size_t>(first)].group_id ==
                     session.state().room_entries[static_cast<std::size_t>(middle)].group_id);

              PlayableShelterState blocked_state = session.state();
              PlayableShelterSession blocked(blocked_state);
              const int blocked_room = blocked.room_index_at(2, 0);
              assert(blocked.assign_resident_to_room(0u, blocked_room));
              assert(blocked.preview_demolish_selected().result ==
                     RoomLifecycleResult::UnsafeResidents);
              assert(blocked.confirm_demolish_selected() ==
                     RoomLifecycleResult::UnsafeResidents);
              assert(blocked.room_index_at(2, 0) == blocked_room);
              assert(valid_playable_state(blocked.state()));
          }

          '''
          marker = 'void v1_migrates_to_v2_and_atomic_backup_recovers() {'
          if marker not in text:
              raise SystemExit('test marker missing')
          text = text.replace(marker, insertion + marker, 1)
          text = text.replace('''    changing_floors_requires_a_connected_elevator_shaft();
              v1_migrates_to_v2_and_atomic_backup_recovers();
          ''', '''    changing_floors_requires_a_connected_elevator_shaft();
              playable_room_groups_upgrade_and_demolish_are_atomic();
              v1_migrates_to_v2_and_atomic_backup_recovers();
          ''', 1)
          tests.write_text(text)
          PY
      - name: Run host tests
        run: bash scripts/run_host_tests.sh
      - name: Commit tested runtime
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/gameplay/PlayableShelterSession.hpp source/PlayableShelterSession.cpp tests/playable_shelter_session_tests.cpp
          git commit -m "Integrate playable room lifecycle runtime"
          git push origin HEAD:agent/playable-room-lifecycle
