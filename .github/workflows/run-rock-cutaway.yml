name: Run rock cutaway patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/large-dense-rooms
      - name: Execute validated patch workflow body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-rock-cutaway.yml').read_text().splitlines()
          marker = next(i for i, line in enumerate(source) if line.strip() == 'run: |')
          body = []
          for line in source[marker + 1:]:
              if line.startswith('          '):
                  body.append(line[10:])
              elif line.strip():
                  break
          Path('/tmp/apply-rock-cutaway.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/apply-rock-cutaway.sh
