name: Diagnose room lifecycle V3 persistence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/playable-room-lifecycle' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/playable-room-lifecycle
      - name: Run V3 patch and capture failure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-room-lifecycle-v3.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n      - name: Run host tests"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply_room_lifecycle_v3.py').write_text(script)
          PY
          set +e
          python3 /tmp/apply_room_lifecycle_v3.py > room-lifecycle-v3-patch.log 2>&1
          status=$?
          cat room-lifecycle-v3-patch.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add room-lifecycle-v3-patch.log
          git commit -m "Capture V3 persistence patch diagnostic"
          git push origin HEAD:agent/playable-room-lifecycle
          exit "$status"
