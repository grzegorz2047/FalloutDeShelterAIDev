name: Policy checks

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  asset-policy:
    name: Asset provenance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/large-dense-rooms
          fetch-depth: 0
      - name: Apply reviewed resident activity pass
        run: python3 .github/scripts/apply_resident_activity_pass.py
      - name: Verify reviewed visual diff
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- .github/workflows/build.yml
      - name: Run host tests for reviewed pass
        shell: bash
        run: bash scripts/run_host_tests.sh
      - name: Commit reviewed resident activity pass
        shell: bash
        run: |
          if git diff --quiet -- source/Scene3DRenderer.cpp; then
            echo "reviewed resident activity pass already applied"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/Scene3DRenderer.cpp
          git commit -m "visuals: add resident activity and deepen room states"
          git fetch origin agent/large-dense-rooms
          git rebase origin/agent/large-dense-rooms
          git push origin HEAD:agent/large-dense-rooms
      - name: Validate asset manifest and denylist
        run: python3 scripts/check_asset_policy.py
      - name: Compile validator
        run: python3 -m py_compile scripts/check_asset_policy.py
