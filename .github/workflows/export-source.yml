name: Apply issue 95 fix

on:
  push:
    branches:
      - agent/fix-first-save-rotation

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-first-save-rotation
      - name: Apply deterministic persistence patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          session = Path('source/PlayableShelterSession.cpp')
          text = session.read_text()
          old = '''    std::remove(backup.c_str());
              errno = 0;
              if (std::rename(main.c_str(), backup.c_str()) != 0 &&
                  errno != ENOENT) {
                  std::remove(temp.c_str());
                  return PlayableSaveStatus::IoError;
              }
          '''
          new = '''    const PlayableLoadResult current = load_one(main);
              if (current.status == PlayableSaveStatus::Ok) {
                  std::remove(backup.c_str());
                  if (std::rename(main.c_str(), backup.c_str()) != 0) {
                      std::remove(temp.c_str());
                      return PlayableSaveStatus::IoError;
                  }
              } else if (current.status != PlayableSaveStatus::Missing) {
                  std::remove(temp.c_str());
                  return PlayableSaveStatus::IoError;
              } else {
                  std::remove(backup.c_str());
              }
          '''
          if old not in text:
              raise SystemExit('save rotation block not found')
          session.write_text(text.replace(old, new, 1))

          tests = Path('tests/playable_shelter_session_tests.cpp')
          text = tests.read_text()
          old = '''    const std::string path = make_temp_path();
              assert(save_playable_state(path, migrated.state) ==
                     PlayableSaveStatus::Ok);
              PlayableShelterSession newer(migrated.state);
              for (int step = 0; step < 10; ++step) newer.fixed_step();
              assert(save_playable_state(path, newer.state()) ==
                     PlayableSaveStatus::Ok);
          '''
          new = '''    const std::string path = make_temp_path();
              assert(access((path + ".sav").c_str(), F_OK) != 0);
              assert(access((path + ".bak").c_str(), F_OK) != 0);
              assert(save_playable_state(path, migrated.state) ==
                     PlayableSaveStatus::Ok);
              assert(access((path + ".sav").c_str(), F_OK) == 0);
              assert(access((path + ".bak").c_str(), F_OK) != 0);
              PlayableShelterSession newer(migrated.state);
              for (int step = 0; step < 10; ++step) newer.fixed_step();
              assert(save_playable_state(path, newer.state()) ==
                     PlayableSaveStatus::Ok);
              assert(access((path + ".bak").c_str(), F_OK) == 0);
              std::ifstream backup_file(path + ".bak", std::ios::binary);
              const std::vector<std::uint8_t> backup_bytes(
                  (std::istreambuf_iterator<char>(backup_file)),
                  std::istreambuf_iterator<char>());
              const auto decoded_backup = decode_playable_state(backup_bytes);
              assert(decoded_backup.status == PlayableSaveStatus::Ok);
              assert(decoded_backup.state.room_entries[1].production_steps == 73);
          '''
          if old not in text:
              raise SystemExit('host persistence test block not found')
          text = text.replace(old, new, 1)
          text = text.replace('#include <fstream>\n', '#include <fstream>\n#include <iterator>\n', 1)
          tests.write_text(text)

          smoke = Path('source/PlayableSmokeBootstrap.cpp')
          text = smoke.read_text()
          start = text.index('bool seed_existing_save() noexcept {')
          end = text.index('\n\nconst char* resident_state_label', start)
          text = text[:start] + text[end + 2:]
          old = '''    const bool seeded = ok && seed_existing_save();
              const PlayableSaveStatus save_status =
                  seeded ? save_playable_state(kSmokeSavePath, smoke.state())
                         : PlayableSaveStatus::IoError;
              const bool saved = save_status == PlayableSaveStatus::Ok;
              const bool resume_armed = saved && create_flag(kSmokeResumeFlagPath);
              ok = ok && seeded && saved && resume_armed;
          '''
          new = '''    const PlayableSaveStatus first_save_status =
                  ok ? save_playable_state(kSmokeSavePath, smoke.state())
                     : PlayableSaveStatus::IoError;
              const bool first_saved =
                  first_save_status == PlayableSaveStatus::Ok;
              const std::string backup_path =
                  std::string(kSmokeSavePath) + ".bak";
              FILE* unexpected_backup = std::fopen(backup_path.c_str(), "rb");
              const bool backup_absent_after_first = unexpected_backup == nullptr;
              if (unexpected_backup != nullptr) std::fclose(unexpected_backup);
              const PlayableSaveStatus second_save_status =
                  first_saved ? save_playable_state(kSmokeSavePath, smoke.state())
                              : PlayableSaveStatus::IoError;
              FILE* rotated_backup = std::fopen(backup_path.c_str(), "rb");
              const bool backup_rotated = rotated_backup != nullptr;
              if (rotated_backup != nullptr) std::fclose(rotated_backup);
              const bool saved =
                  second_save_status == PlayableSaveStatus::Ok;
              const bool resume_armed = saved && create_flag(kSmokeResumeFlagPath);
              ok = ok && first_saved && backup_absent_after_first &&
                   backup_rotated && saved && resume_armed;
          '''
          if old not in text:
              raise SystemExit('smoke save block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '"invalid_result=%s invalid_unchanged=%d seeded=%d saved=%d "\n            "save_status=%d\\n",',
              '"invalid_result=%s invalid_unchanged=%d first_saved=%d "\n            "backup_absent_after_first=%d backup_rotated=%d saved=%d "\n            "first_save_status=%d save_status=%d\\n",',
              1)
          text = text.replace(
              '''            invalid_unchanged ? 1 : 0,
                      seeded ? 1 : 0,
                      saved ? 1 : 0,
                      static_cast<int>(save_status));''',
              '''            invalid_unchanged ? 1 : 0,
                      first_saved ? 1 : 0,
                      backup_absent_after_first ? 1 : 0,
                      backup_rotated ? 1 : 0,
                      saved ? 1 : 0,
                      static_cast<int>(first_save_status),
                      static_cast<int>(second_save_status));''',
              1)
          smoke.write_text(text)

          azahar = Path('scripts/run_azahar_smoke.sh')
          text = azahar.read_text()
          text = text.replace("grep -q 'seeded=1' azahar-playable-smoke.log\n", "grep -q 'first_saved=1' azahar-playable-smoke.log\ngrep -q 'backup_absent_after_first=1' azahar-playable-smoke.log\ngrep -q 'backup_rotated=1' azahar-playable-smoke.log\n", 1)
          text = text.replace("grep -q 'saved=1' azahar-playable-smoke.log\n", "grep -q 'saved=1' azahar-playable-smoke.log\ngrep -q 'first_save_status=0' azahar-playable-smoke.log\ngrep -q 'save_status=0' azahar-playable-smoke.log\n", 1)
          azahar.write_text(text)

          workflow = Path('.github/workflows/build.yml')
          text = workflow.read_text()
          marker = '''      - name: Upload Azahar logs and playable frames
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: DeepShelter3D-Azahar-logs
                    path: |
                      azahar-*.log
                      azahar-*.png
                    if-no-files-found: warn
          '''
          replacement = marker + '''      - name: Upload shareable game package
                  if: success()
                  uses: actions/upload-artifact@v4
                  with:
                    name: DeepShelter3D-shareable
                    path: |
                      dist/DeepShelter3D.3dsx
                      dist/DeepShelter3D.cia
                      dist/SHA256SUMS.txt
                      azahar-first-frame.png
                      azahar-top-screen-3x.png
                      azahar-bottom-screen-3x.png
                    if-no-files-found: error
          '''
          if marker not in text:
              raise SystemExit('Azahar artifact block not found')
          workflow.write_text(text.replace(marker, replacement, 1))
          PY
      - name: Run host tests
        run: bash scripts/run_host_tests.sh
      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/export-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/PlayableShelterSession.cpp source/PlayableSmokeBootstrap.cpp tests/playable_shelter_session_tests.cpp scripts/run_azahar_smoke.sh .github/workflows/build.yml .github/workflows/export-source.yml
          git commit -m "Fix first save rotation on 3DS"
          git push origin HEAD:agent/fix-first-save-rotation
