name: One-shot render pass fix

on:
  push:
    branches:
      - agent/richer-room-props-83

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/richer-room-props-83
      - name: Separate accent pass
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/Scene3DRenderer.cpp')
          text = path.read_text()
          old_selection = '    if (selected) append_selection(mesh_, x, y);\n}'
          new_selection = '    (void)selected;\n}'
          if old_selection not in text:
              raise SystemExit('selection anchor not found')
          text = text.replace(old_selection, new_selection, 1)
          old_tail = '''    prop_vertex_end_ = mesh_.vertex_count();

    stats.draw_calls = mesh_.vertex_count() > 0 ? 3 : 0;'''
          new_tail = '''    prop_vertex_end_ = mesh_.vertex_count();

    // Real third pass: illuminated strips and selection foreground.
    for (int room = 0; room < active_rooms; ++room) {
        const float x = layout::kRoomX[room];
        const float y = layout::kRoomY[room];
        if (!camera.visible(x, y, layout::kRoomWidth, layout::kRoomHeight)) continue;
        mesh_.append_box({x + 14.0f, y + 8.0f, -2.0f, 104.0f, 3.0f, 3.0f,
                          room_accent(room), assets::GeneratedMaterial::ControlPanel});
        mesh_.append_box({x + 18.0f, y + 46.0f, -2.0f, 96.0f, 3.0f, 3.0f,
                          room_accent(room), assets::GeneratedMaterial::ControlPanel});
    }
    if (state.selected_room >= 0 && state.selected_room < active_rooms) {
        const int selected = state.selected_room;
        const float x = layout::kRoomX[selected];
        const float y = layout::kRoomY[selected];
        if (camera.visible(x, y, layout::kRoomWidth, layout::kRoomHeight)) {
            append_selection(mesh_, x, y);
        }
    }

    stats.draw_calls = mesh_.vertex_count() > 0 ? 3 : 0;'''
          if old_tail not in text:
              raise SystemExit('pass anchor not found')
          path.write_text(text.replace(old_tail, new_tail, 1))
          PY
      - name: Commit renderer patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/Scene3DRenderer.cpp
          git commit -m "visuals: separate room accents into third render pass"
          git push origin HEAD:agent/richer-room-props-83
