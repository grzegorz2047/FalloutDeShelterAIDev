name: Apply PICA200 renderer migration

on:
  push:
    branches:
      - agent/richer-room-props-83

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[pica-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/richer-room-props-83
          fetch-depth: 2
      - name: Apply hardware quality pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('source/Scene3DRenderer.cpp')
          text = renderer.read_text()
          for old, new in [
              ('constexpr u32 c = 0xFF56C7F0;',
               'constexpr u32 c = rgba(86, 199, 240, 144);'),
              ('C3D_TexSetFilter(&material_texture_, GPU_NEAREST, GPU_NEAREST);',
               'C3D_TexSetFilter(&material_texture_, GPU_LINEAR, GPU_LINEAR);'),
              ('    if (selected) append_selection(mesh_, x, y);\n}',
               '    (void)selected;\n}'),
          ]:
              if old not in text:
                  raise SystemExit(f'missing renderer anchor: {old!r}')
              text = text.replace(old, new, 1)

          old_tail = '''    prop_vertex_end_ = mesh_.vertex_count();

    stats.draw_calls = mesh_.vertex_count() > 0 ? 3 : 0;
    stats.estimated_linear_memory =
        mesh_.vertex_count() * sizeof(Vertex3D) + assets::kGeneratedMaterialRuntimeBytes;
}'''
          new_tail = '''    prop_vertex_end_ = mesh_.vertex_count();

    // Dedicated translucent foreground range for real additive light.
    for (int room = 0; room < active_rooms; ++room) {
        const float x = layout::kRoomX[room];
        const float y = layout::kRoomY[room];
        if (!camera.visible(x, y, layout::kRoomWidth, layout::kRoomHeight)) continue;
        const u32 accent = room_accent(room);
        const u32 soft = (accent & 0x00ffffffu) | (static_cast<u32>(72) << 24);
        const u32 bright = (accent & 0x00ffffffu) | (static_cast<u32>(118) << 24);
        mesh_.append_box({x + 17.0f, y + 7.0f, -2.0f, 98.0f, 3.0f, 3.0f,
                          bright, assets::GeneratedMaterial::ControlPanel});
        mesh_.append_box({x + 26.0f, y + 46.0f, -2.0f, 80.0f, 2.0f, 3.0f,
                          soft, assets::GeneratedMaterial::ControlPanel});
    }
    if (state.selected_room >= 0 && state.selected_room < active_rooms) {
        const int selected = state.selected_room;
        const float x = layout::kRoomX[selected];
        const float y = layout::kRoomY[selected];
        if (camera.visible(x, y, layout::kRoomWidth, layout::kRoomHeight)) {
            append_selection(mesh_, x, y);
        }
    }

    const std::size_t total = mesh_.vertex_count();
    std::size_t draw_calls = structure_vertex_end_ > 0 ? 1u : 0u;
    if (prop_vertex_end_ > structure_vertex_end_) ++draw_calls;
    if (total > prop_vertex_end_) ++draw_calls;
    stats.draw_calls = static_cast<int>(draw_calls);
    stats.estimated_linear_memory =
        total * sizeof(Vertex3D) + assets::kGeneratedMaterialRuntimeBytes;
}'''
          if old_tail not in text:
              raise SystemExit('missing scene tail anchor')
          text = text.replace(old_tail, new_tail, 1)

          old_draw = '''    C3D_FVUnifMtx4x4(GPU_VERTEX_SHADER, projection_uniform_, &projection);
    C3D_FVUnifMtx4x4(GPU_VERTEX_SHADER, model_view_uniform_, &view);
    C3D_DepthTest(true, GPU_GEQUAL, GPU_WRITE_ALL);
    C3D_CullFace(GPU_CULL_NONE);

    const std::size_t total = mesh_.vertex_count();
    const std::size_t structure_end = std::min(structure_vertex_end_, total);
    const std::size_t props_end = std::max(structure_end,
                                           std::min(prop_vertex_end_, total));
    if (structure_end > 0) {
        C3D_DrawArrays(GPU_TRIANGLES, 0, static_cast<int>(structure_end));
    }
    if (props_end > structure_end) {
        C3D_DrawArrays(GPU_TRIANGLES,
                       static_cast<int>(structure_end),
                       static_cast<int>(props_end - structure_end));
    }
    if (total > props_end) {
        C3D_DrawArrays(GPU_TRIANGLES,
                       static_cast<int>(props_end),
                       static_cast<int>(total - props_end));
    }
}'''
          new_draw = '''    C3D_FVUnifMtx4x4(GPU_VERTEX_SHADER, projection_uniform_, &projection);
    C3D_FVUnifMtx4x4(GPU_VERTEX_SHADER, model_view_uniform_, &view);
    C3D_CullFace(GPU_CULL_NONE);

    const std::size_t total = mesh_.vertex_count();
    const std::size_t structure_end = std::min(structure_vertex_end_, total);
    const std::size_t props_end = std::max(structure_end,
                                           std::min(prop_vertex_end_, total));

    C3D_AlphaBlend(GPU_BLEND_ADD, GPU_BLEND_ADD,
                   GPU_ONE, GPU_ZERO, GPU_ONE, GPU_ZERO);
    C3D_DepthTest(true, GPU_GEQUAL, GPU_WRITE_ALL);
    if (structure_end > 0) {
        C3D_DrawArrays(GPU_TRIANGLES, 0, static_cast<int>(structure_end));
    }
    if (props_end > structure_end) {
        C3D_DrawArrays(GPU_TRIANGLES,
                       static_cast<int>(structure_end),
                       static_cast<int>(props_end - structure_end));
    }

    if (total > props_end) {
        C3D_AlphaBlend(GPU_BLEND_ADD, GPU_BLEND_ADD,
                       GPU_SRC_ALPHA, GPU_ONE, GPU_SRC_ALPHA, GPU_ONE);
        C3D_DepthTest(true, GPU_GEQUAL, GPU_WRITE_COLOR);
        C3D_DrawArrays(GPU_TRIANGLES,
                       static_cast<int>(props_end),
                       static_cast<int>(total - props_end));
    }

    C3D_AlphaBlend(GPU_BLEND_ADD, GPU_BLEND_ADD,
                   GPU_ONE, GPU_ZERO, GPU_ONE, GPU_ZERO);
    C3D_DepthTest(true, GPU_GEQUAL, GPU_WRITE_ALL);
}'''
          if old_draw not in text:
              raise SystemExit('missing draw-pass anchor')
          renderer.write_text(text.replace(old_draw, new_draw, 1))

          scene = Path('source/Scene3D.cpp')
          scene_text = scene.read_text()
          if 'constexpr float kUvInset = 0.002f;' not in scene_text:
              raise SystemExit('missing UV inset anchor')
          scene.write_text(scene_text.replace(
              'constexpr float kUvInset = 0.002f;',
              'constexpr float kUvInset = 0.0045f;', 1))

          main = Path('source/main.cpp')
          main_text = main.read_text()
          namespace_anchor = '}  // namespace\n\nint main() {'
          helper = '''C3D_RenderTarget* create_top_target(gfx3dSide_t side) noexcept {
    C3D_RenderTarget* target = C3D_RenderTargetCreate(
        GSP_SCREEN_WIDTH,
        GSP_SCREEN_HEIGHT_TOP,
        GPU_RB_RGBA8,
        GPU_RB_DEPTH24_STENCIL8);
    if (target != nullptr) {
        C3D_RenderTargetSetOutput(
            target, GFX_TOP, side,
            GX_TRANSFER_FLIP_VERT(0) | GX_TRANSFER_OUT_TILED(0) |
                GX_TRANSFER_RAW_COPY(0) |
                GX_TRANSFER_IN_FORMAT(GX_TRANSFER_FMT_RGBA8) |
                GX_TRANSFER_OUT_FORMAT(GX_TRANSFER_FMT_RGB8) |
                GX_TRANSFER_SCALING(GX_TRANSFER_SCALE_NO));
    }
    return target;
}

}  // namespace

int main() {'''
          if namespace_anchor not in main_text:
              raise SystemExit('missing main namespace anchor')
          main_text = main_text.replace(namespace_anchor, helper, 1)
          old_targets = '''    C3D_RenderTarget* top_left = C2D_CreateScreenTarget(GFX_TOP, GFX_LEFT);
    C3D_RenderTarget* top_right = C2D_CreateScreenTarget(GFX_TOP, GFX_RIGHT);
    C3D_RenderTarget* bottom = C2D_CreateScreenTarget(GFX_BOTTOM, GFX_LEFT);'''
          new_targets = '''    C3D_RenderTarget* top_left = create_top_target(GFX_LEFT);
    C3D_RenderTarget* top_right = create_top_target(GFX_RIGHT);
    C3D_RenderTarget* bottom = C2D_CreateScreenTarget(GFX_BOTTOM, GFX_LEFT);'''
          if old_targets not in main_text:
              raise SystemExit('missing render target anchor')
          main.write_text(main_text.replace(old_targets, new_targets, 1))

          Path('docs/PICA200_VISUAL_BUDGET.md').write_text('''# PICA200 visual budget

The renderer uses Nintendo 3DS GPU capacity as a quality budget rather than a one-draw-call target.

## Implemented
- top-eye targets use RGBA8 with 24-bit depth and 8-bit stencil;
- structure, detailed equipment and additive foreground light are separate ranges;
- additive light uses `SRC_ALPHA + ONE`, depth testing and color-only writes;
- the RGB565 material atlas uses linear filtering with protected UV borders;
- the fixed mesh ceiling remains 8192 vertices.

## Deferred
Phong/cel lighting, normal mapping, shadow maps and environment reflections require editable shader sources. See issue #89.
''')
          PY
      - name: Commit code and restore normal CI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout HEAD^ -- .github/workflows/build.yml
          git rm -f .github/workflows/one-shot-pica200-quality.yml
          git add source/Scene3DRenderer.cpp source/Scene3D.cpp source/main.cpp docs/PICA200_VISUAL_BUDGET.md .github/workflows/build.yml
          git commit -m "visuals: use PICA200 depth and additive light pass [pica-applied]"
          git push origin HEAD:agent/richer-room-props-83
